name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Server
        working-directory: server
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Client
        working-directory: client
        run: |
          npm ci
          npx tsc --noEmit
          npm test
