name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Server
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rf4spots
        run: |
          npm ci
          npx prisma validate
          npx tsc --noEmit
          npm test
          npm run build
      - name: Client
        working-directory: client
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
