services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rf4
      POSTGRES_PASSWORD: rf4
      POSTGRES_DB: rf4spots
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rf4 -d rf4spots"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./server
    ports:
      - "3780:3780"
    environment:
      DATABASE_URL: postgresql://rf4:rf4@db:5432/rf4spots
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3780
      HOST: 0.0.0.0
    volumes:
      - uploads:/app/uploads
      - ./server/assets/maps:/app/assets/maps:ro
      - ./server/prisma/seeds:/app/prisma/seeds:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
